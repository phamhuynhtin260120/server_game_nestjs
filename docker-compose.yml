services:
  game-server:
    build:
      context: .
      target: runner
    image: server-game-nestjs:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://game_user:game_password@postgres:5432/game_server_dev?schema=public
    ports:
      - '3000:3000'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game_server_dev
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U game_user -d game_server_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
